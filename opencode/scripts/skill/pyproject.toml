[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-cli"
version = "0.1.0"
description = "List agent skills and resolve their absolute paths."
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4",
    "pydantic>=2",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3",
    "rich>=13",
]

[project.scripts]
skill-cli = "skill_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_cli"]
